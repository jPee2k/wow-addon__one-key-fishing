# Checks and tests every push to main and develop and every pull request. A pushed version tag on main (for
# example `1.0.0`, equal to the version in package.json) is packaged by BigWigsMods/packager and uploaded to
# GitHub Releases and, once the TOC has `## X-Curse-Project-ID` and the CF_API_KEY secret is set, to CurseForge.
name: Check and release

on:
  push:
    branches: [main, develop]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # A release must not ship code built on an assumption that waits for an in-game check (`-- VERIFY(<id>)`),
      # unless the tag's message says --force (`git tag -a 1.3.0 -m "Release 1.3.0 --force"`): then the markers
      # ship, listed as a warning. The checkout leaves an annotated tag as a plain ref, so the tag is fetched first.
      # Only an annotated tag's own message counts: for a lightweight tag %(contents) is the commit's message.
      - name: No open VERIFY markers
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --force origin "+$GITHUB_REF:$GITHUB_REF"
          if [ "$(git cat-file -t "$GITHUB_REF")" = tag ] \
            && git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | grep -qE -- '(^|[[:space:]])--force([[:space:]]|$)'; then
            node tools/check.mjs --release --force
          else
            node tools/check.mjs --release
          fi

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Releases come from main only: develop is merged into main, and the tag goes on that commit.
      - name: Tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main; merge develop into main and tag the main commit" >&2
            exit 1
          fi
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      # The packager puts the whole CHANGELOG.md on the CurseForge file page.
      - name: No Unreleased section in the changelog
        run: |
          if grep -qi '^## \[Unreleased\]' CHANGELOG.md; then
            echo "CHANGELOG.md still has an Unreleased section; move its items into the version entry" >&2
            exit 1
          fi
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
